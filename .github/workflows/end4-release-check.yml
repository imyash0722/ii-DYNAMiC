name: End-4 Upstream Release Check

on:
  schedule:
    # Run every 6 hours (at 01:00, 07:00, 13:00, 19:00 UTC - staggered from upstream-sync-check)
    - cron: '0 1,7,13,19 * * *'
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Target repository to check releases for'
        required: true
        default: 'end-4/dots-hyprland'

permissions:
  contents: read
  issues: write

jobs:
  check-end4-release:
    name: Check end-4 Releases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check latest release from end-4
        id: check-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ github.event.inputs.target_repo || 'end-4/dots-hyprland' }}
        run: |
          echo "Checking latest release from ${TARGET_REPO}..."

          # Fetch latest release data via GitHub API
          RELEASE_JSON=$(gh api "repos/${TARGET_REPO}/releases" --jq '.[0] // empty' 2>/dev/null || echo "")

          if [ -z "${RELEASE_JSON}" ]; then
            echo "No release found on ${TARGET_REPO}."
            echo "has_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG_NAME=$(echo "${RELEASE_JSON}" | jq -r '.tag_name // empty')
          RELEASE_TITLE=$(echo "${RELEASE_JSON}" | jq -r '.name // empty')
          RELEASE_URL=$(echo "${RELEASE_JSON}" | jq -r '.html_url // empty')
          PUBLISHED_AT=$(echo "${RELEASE_JSON}" | jq -r '.published_at // empty')
          BODY=$(echo "${RELEASE_JSON}" | jq -r '.body // empty')

          if [ -z "${TAG_NAME}" ]; then
            echo "Release tag is empty."
            echo "has_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found latest release: ${RELEASE_TITLE} (${TAG_NAME})"
          echo "has_release=true" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"
          echo "release_url=${RELEASE_URL}" >> "$GITHUB_OUTPUT"
          echo "published_at=${PUBLISHED_AT}" >> "$GITHUB_OUTPUT"

          # Write body safely to temporary file
          echo "${BODY}" > /tmp/release_body.txt

      - name: Manage Release Issue
        if: steps.check-release.outputs.has_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.check-release.outputs.tag_name }}
          RELEASE_TITLE: ${{ steps.check-release.outputs.release_title }}
          RELEASE_URL: ${{ steps.check-release.outputs.release_url }}
          PUBLISHED_AT: ${{ steps.check-release.outputs.published_at }}
          TARGET_REPO: ${{ github.event.inputs.target_repo || 'end-4/dots-hyprland' }}
        run: |
          LABEL="upstream-end4-release"

          # Ensure label exists
          gh label create "${LABEL}" --description "Notifies when end-4 repository publishes a new release" --color "7057ff" --force 2>/dev/null || true

          # Search if an issue already exists for this tag (open or closed)
          EXISTING_ISSUE_NUM=$(gh issue list \
            --repo "${{ github.repository }}" \
            --label "${LABEL}" \
            --state all \
            --json number,title \
            --jq ".[] | select(.title | contains(\"${TAG_NAME}\")) | .number" | head -n 1)

          if [ -n "${EXISTING_ISSUE_NUM}" ]; then
            echo "Issue #${EXISTING_ISSUE_NUM} already exists for release tag ${TAG_NAME}. Skipping issue creation."
            exit 0
          fi

          echo "No existing issue found for ${TAG_NAME}. Creating new issue..."

          TITLE="[end-4 Release] ${RELEASE_TITLE:-$TAG_NAME} (${TAG_NAME})"

          cat <<EOF > /tmp/issue_template.md
          ## 🚀 New Release from ${TARGET_REPO}

          A new release has been published upstream on [${TARGET_REPO}](https://github.com/${TARGET_REPO}):

          - **Release Tag**: [${TAG_NAME}](${RELEASE_URL})
          - **Release Title**: ${RELEASE_TITLE}
          - **Published At**: ${PUBLISHED_AT}
          - **Release Link**: [View Release on GitHub](${RELEASE_URL})

          ---

          ### 📝 Release Notes

          $(cat /tmp/release_body.txt)

          ---

          ### 📋 Mandatory Review & Integration Protocol

          Per the project rules in \`GEMINI.md\`:
          1. **Generate Change Summary**: Summarize all modifications, features, and fixes from the release.
          2. **User Alignment Discussion**: Present and discuss the summary with the user first.
          3. **Plan Integration**: Formulate an integration plan together with the user.
          4. **Execute**: Proceed with integration only after agreeing on the plan.

          > _This issue was automatically generated by the [End-4 Upstream Release Check](https://github.com/${{ github.repository }}/actions/workflows/end4-release-check.yml) workflow._
          EOF

          sed -i 's/^          //' /tmp/issue_template.md

          gh issue create \
            --repo "${{ github.repository }}" \
            --title "${TITLE}" \
            --body-file /tmp/issue_template.md \
            --label "${LABEL}"

          echo "Successfully raised issue for release ${TAG_NAME}."
